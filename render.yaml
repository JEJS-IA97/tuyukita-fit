services:
  - type: web
    name: yukita-fit-api
    runtime: node
    plan: free
    buildCommand: cd backend && corepack pnpm@10.14.0 install --frozen-lockfile && pnpm exec prisma generate && pnpm exec prisma db push && pnpm run build
    startCommand: cd backend && node dist/src/main.js
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: CORS_ORIGIN
        value: http://localhost:8081
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
